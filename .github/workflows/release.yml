name: Release

# Stages the package on npm and creates a GitHub release whenever a version tag (v*) is pushed.
# The staged version only becomes installable once a maintainer approves it (npm stage approve).
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # create the GitHub release
  id-token: write   # OIDC token for npm Trusted Publishing

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check tag matches package.json version
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version ($expected)"
            exit 1
          fi

      - name: Use an npm that supports staged publishing (>= 11.15.0)
        run: npm install -g npm@latest

      - run: npm ci

      - run: npm test

      - name: Stage on npm
        run: npm stage publish

      - name: Create GitHub release
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
